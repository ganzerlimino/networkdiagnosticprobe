[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-diagnostic-probe"
version = "0.3.5"
description = "Portable network diagnostic probe for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Network Diagnostic Probe contributors" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["pygame>=2.5"]
web = ["fastapi>=0.100", "uvicorn[standard]>=0.23"]
dev = ["pytest>=7.4"]

[project.scripts]
ndp = "ndp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ndp*"]

[tool.setuptools.package-data]
ndp = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
