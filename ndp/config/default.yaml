# Default NDP configuration. Copy to /etc/ndp/config.yaml to override.

interface: eth0

poll_interval_link_up: 1
poll_interval_link_down: 5

lldp:
  cache_ttl_seconds: 30

ui:
  enabled: false
  framebuffer: "/dev/fb1"
  width: 320
  height: 240
  sdl_driver: "fbcon"
  font_size: 18
  fps: 10
  button_previous: 23
  button_select: 24
  button_next: 25
  button_debounce_seconds: 0.2

console:
  enabled: true
  refresh_seconds: 5

web:
  enabled: false
  host: "0.0.0.0"
  port: 8080

wifi_hotspot:
  enabled: false
  ssid_prefix: "NDP"

discovery:
  disconnect_wait_seconds: 8
  flush_arp_before_second_scan: true
  verify_replug: true

logging:
  level: INFO
