# Default NDP configuration. Copy to /etc/ndp/config.yaml to override.

interface: eth0

poll_interval_link_up: 1
poll_interval_link_down: 5

lldp:
  cache_ttl_seconds: 30

ui:
  enabled: false
  framebuffer: "/dev/fb1"
  width: 320
  height: 240
  sdl_driver: "fbcon"
  backend: "auto"   # auto | raw | sdl  (Lite/Bookworm: auto uses raw /dev/fb1)
  backlight_gpio: 18
  backlight_enabled: true
  rgb565_bgr: false
  rgb565_swap_bytes: false
  font_size: 16          # body text (pt); title = +4, button hints = -2
  fps: 10
  button_previous: 23
  button_select: 24
  button_next: 25
  button_debounce_seconds: 0.2
  hint_edge: left        # left | right | bottom — Joy-it V3 + rotate=270: buttons on the left
  content_margin_side: 32
  hint_y_offset: 24      # shift side hints down (~5 mm on 3.2" TFT)

console:
  enabled: true
  refresh_seconds: 5

web:
  enabled: false
  host: "0.0.0.0"
  port: 8080

wifi_hotspot:
  enabled: false
  ssid_prefix: "NDP"

discovery:
  disconnect_wait_seconds: 8
  flush_arp_before_second_scan: true
  verify_replug: true

logging:
  level: INFO
